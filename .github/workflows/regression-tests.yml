name: Regression Tests

on:
  push:
    branches: [ alpha ]
  pull_request:
    branches: [ alpha ]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: 'yarn'
      - name: Install deps
        run: yarn install --frozen-lockfile || yarn install
      - name: Run regression tests
        run: node ./node_modules/jest/bin/jest.js --config regression-tests/jest.config.js --runInBand
